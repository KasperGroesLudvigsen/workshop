# Single source of truth for the screener's hard-filter thresholds and switches.
# Read by both the batch scorer (src/screener/config.py) and embedded into the
# generated site's JSON so the client can recompute counts/filters live.

# Hard filter distances, in km.
water_km: 7.0
hangout_km: 4.0
grocery_km: 10.0

# Lakes smaller than this (hectares) are excluded from open-water distance
# entirely, regardless of eligibility — farm ponds, drainage basins, flooded
# pits carry the same OSM tags as real lakes.
min_lake_area_ha: 5.0

# Whether a lake must have a positive swimmability signal (badevand /
# leisure=swimming_area / natural=beach on its shore) to count toward
# open_water_km. Strict silently drops good listings whose lake has no
# official designation but is genuinely swimmable; loose is more permissive.
# Both are computed and shipped to the site so the UI toggle is instant.
lake_strict: true

# Outer radius (km) used when building the per-listing amenity candidate
# lists shipped to the client. Must be >= the largest of the informational
# amenity radii the UI is expected to let the user dial up to.
amenity_search_radius_km: 15.0

# Region scope: postal code ranges covering Sjaelland, Lolland, Falster, Moen.
postal_ranges:
  - [3000, 3699]
  - [4000, 4990]

# Boligsiden addressType for fritidsbolig. Confirmed live 2026-09-15 via the
# API's own 400 error body, which lists the full valid addressTypes enum --
# see fetch/boligsiden.py docstring.
fritidsbolig_address_type: "holiday house"

# Categories that are hard filters (fail => listing excluded).
hard_filter_categories:
  - water
  - hangout
  - grocery

# Informational-only amenity categories: distance/count/names are computed
# and shown, but never exclude a listing.
informational_categories:
  - playground
  - pool
  - marina
  - fish_shop
  - wine_shop
  - ice_cream
  - butcher
  - beach

# Boligsiden fetch politeness. No documented rate limit or blocking observed
# live (unlike Boliga's Cloudflare), but a considerate default throttle is
# kept anyway -- see fetch/boligsiden.py docstring.
boligsiden:
  base_url: "https://api.boligsiden.dk/search/cases"
  requests_per_second: 3.0
  per_page: 500
  user_agent: "summer-house-screener/0.1 (contact: groes.ludvigsen@gmail.com)"

# DB07 branch-code prefixes per CVR-discoverable category, for bulk business
# discovery via fetch/cvr_discovery.py (Erhvervsstyrelsen's cvr-permanent).
#
# IMPORTANT, found live 2026-09-16: DB07 branch codes were revised effective
# 2025-01-01. A code that looks right from a plain text search (e.g. old
# "561010" for restaurants) can return zero currently-active businesses --
# every active company was migrated to the new code (e.g. "561110") when
# the revision landed; only ceased/historical companies still carry the old
# one. Every code below was confirmed live against *currently active*
# ("sammensatStatus": "aktiv") companies specifically, not just a text
# match against branchetekst -- confirm the same way before adding more.
# ice_cream has no entry: the closest code (563010, "Udskaenkning af
# ikke-alkoholiske drikkevarer") is beverage bars/cafes generally, not
# ice-cream-specific, so using it would misclassify -- same gap as today,
# not a regression.
cvr_branch_codes:
  hangout: ["561110", "561190", "563010", "563020"]  # Restauranter/caféer; øvrige spisesteder; udskænkning (alk./ikke-alk.)
  grocery: ["471120", "471110"]        # Dagligvarer i supermarkeder/købmandsbutikker; kioskvarer
  fish_shop: ["472300"]                # Detailhandel med fisk, krebsdyr og bløddyr
  wine_shop: ["472500"]                # Detailhandel med drikkevarer (no wine-specific DB07 code exists)
  butcher: ["472200"]                  # Detailhandel med kød og kødprodukter
